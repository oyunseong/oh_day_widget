<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Day</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flipdown@0.3.2/dist/flipdown.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flipdown@0.3.2/src/flipdown.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root{
            --brass:#b98a4a;
            --brass-soft:#d8b478;
            --shadow-dark: 0 18px 40px rgba(0,0,0,0.35);
            --shadow-light: 0 14px 32px rgba(60,50,30,0.16);
        }

        /* ---- 테마 토큰 : data-theme 속성에 따라 값만 바뀜, 클래스 이름은 고정 ---- */
        html[data-theme="dark"]{
            --bg-1:#1c2029;
            --bg-2:#262b38;
            --text-on-bg:#f4eee1;
            --surface:#f4eee1;
            --surface-2:#e9e0cc;
            --surface-text:#1c2029;
            --overlay:rgba(244,238,225,0.08);
            --overlay-hover:rgba(244,238,225,0.16);
            --border-line:rgba(244,238,225,0.16);
            --shadow: var(--shadow-dark);
            --muted:#9a9078;
        }
        html[data-theme="light"]{
            --bg-1:#f7f2e6;
            --bg-2:#ece1c6;
            --text-on-bg:#22262f;
            --surface:#ffffff;
            --surface-2:#f1e9d8;
            --surface-text:#22262f;
            --overlay:rgba(28,32,41,0.05);
            --overlay-hover:rgba(28,32,41,0.09);
            --border-line:rgba(28,32,41,0.12);
            --shadow: var(--shadow-light);
            --muted:#7d7561;
        }

        /* ---- FlipDown 커스텀 테마 (brass / ivory, 탁구 스코어보드 느낌) ----
           실제 라이브러리 소스 클래스명 기준: rotor, rotor-top, rotor-bottom,
           rotor-leaf-front, rotor-leaf-rear, rotor-group-heading, rotor-group:nth-child(2/3)
           카드 자체는 라이트/다크와 무관하게 항상 아이보리 종이 카드로 통일 */

        .flipdown-wrap{
            display:flex;
            justify-content:center;
            width:100%;
            height:143px;      /* 110px * 1.3 — transform으로 커진 실제 시각 크기만큼 공간을 미리 확보해둠 */
            overflow:visible;
            margin:0 auto;
        }
        .flipdown-wrap .flipdown{
            transform:scale(1.3);
            transform-origin: top center;
        }

        .flipdown.flipdown__theme-dark{
            font-family:'JetBrains Mono', monospace;
            font-weight:700;
        }

        /* 헤딩(일/시간/분/초) 텍스트 */
        .flipdown.flipdown__theme-dark .rotor-group-heading::before{
            color:#a9a08a;
            font-family:'JetBrains Mono', monospace;
            font-size:11px;
            letter-spacing:0.14em;
            text-transform:uppercase;
        }

        /* 카드 앞면 (위쪽 절반) */
        .flipdown.flipdown__theme-dark .rotor,
        .flipdown.flipdown__theme-dark .rotor-top,
        .flipdown.flipdown__theme-dark .rotor-leaf-front{
            color:#20242e;
            background-color:#f6efdd;
        }
        /* 카드 뒷면 (아래쪽 절반) — 살짝 톤 다운으로 입체감 */
        .flipdown.flipdown__theme-dark .rotor-bottom,
        .flipdown.flipdown__theme-dark .rotor-leaf-rear{
            color:#39404f;
            background-color:#e7dcc0;
        }
        /* 카드 중앙 접히는 선 */
        .flipdown.flipdown__theme-dark .rotor:after{
            border-top:solid 1px rgba(28,32,41,0.18);
        }
        /* 그룹 사이 콜론(:) 구분점 — 브라스 색 */
        .flipdown.flipdown__theme-dark .rotor-group:nth-child(n+2):nth-child(-n+3)::before,
        .flipdown.flipdown__theme-dark .rotor-group:nth-child(n+2):nth-child(-n+3)::after{
            background-color:#d8b478;
        }

        /* 구조적 스타일 — 라운드 코너 + 그림자로 종이 질감 강조
           (rotor-top/bottom은 정지 상태, rotor-leaf-front/rear는 애니메이션 중 보이는 면 —
            둘 다 같은 radius로 맞춰야 넘어갈 때 모서리가 안 튐) */
        .flipdown .rotor{
            border-radius:8px;
            box-shadow:0 10px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .flipdown .rotor-top,
        .flipdown .rotor-leaf-front{
            border-radius:8px 8px 0 0;
        }
        .flipdown .rotor-bottom,
        .flipdown .rotor-leaf-rear{
            border-radius:0 0 8px 8px;
        }
        .flipdown .rotor:after{
            border-radius:0 0 8px 8px;
        }

        @media (max-width:480px){
            .flipdown-wrap{ height:110px; }
            .flipdown-wrap .flipdown{ transform:scale(1); }
        }

        *{box-sizing:border-box;}

        html,body{
            margin:0;
            padding:0;
            width:100%;
            height:100%;
            background:transparent;
            font-family:'Noto Serif KR', serif;
            color:var(--text-on-bg);
            -webkit-font-smoothing:antialiased;
        }

        #app{
            width:100%;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
                    radial-gradient(1200px 600px at 20% -10%, rgba(184,138,74,0.12), transparent 60%),
                    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
            padding:28px 16px;
            transition: background .25s ease;
        }

        /* ---------- 테마 토글 버튼 (항상 우상단, 렌더링과 무관하게 고정) ---------- */
        .theme-toggle{
            position:fixed;
            top:14px;
            right:14px;
            width:36px;
            height:36px;
            border-radius:50%;
            border:1px solid var(--border-line);
            background:var(--overlay);
            color:var(--text-on-bg);
            font-size:16px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            z-index:50;
            transition:background .15s ease;
        }
        .theme-toggle:hover{ background:var(--overlay-hover); }

        /* ---------- SETUP VIEW ---------- */
        .setup-card{
            width:100%;
            max-width:380px;
            background:var(--surface);
            color:var(--surface-text);
            border-radius:18px;
            padding:32px 28px 28px;
            box-shadow:var(--shadow);
            position:relative;
            overflow:hidden;
        }
        .setup-card::before{
            content:"";
            position:absolute;
            top:0;left:0;right:0;
            height:6px;
            background:linear-gradient(90deg,var(--brass),var(--brass-soft));
        }
        .setup-eyebrow{
            font-family:'JetBrains Mono', monospace;
            font-size:11px;
            letter-spacing:0.18em;
            color:var(--brass);
            text-transform:uppercase;
            margin-bottom:8px;
        }
        .setup-title{
            font-size:22px;
            font-weight:700;
            margin:0 0 22px;
            line-height:1.35;
        }
        .field{
            margin-bottom:16px;
        }
        .field label{
            display:block;
            font-size:12px;
            color:var(--muted);
            margin-bottom:6px;
            letter-spacing:0.02em;
        }
        .field input{
            width:100%;
            padding:11px 12px;
            border-radius:9px;
            border:1.5px solid var(--surface-2);
            background:var(--surface);
            font-family:'Noto Serif KR', serif;
            font-size:14px;
            color:var(--surface-text);
            outline:none;
            transition:border-color .15s ease;
        }
        .field input:focus{
            border-color:var(--brass);
        }
        .row2{
            display:flex;
            gap:10px;
        }
        .row2 .field{flex:1;}

        .make-btn{
            width:100%;
            margin-top:6px;
            padding:13px 0;
            border:none;
            border-radius:9px;
            background:#1c2029;
            color:#f4eee1;
            font-family:'Noto Serif KR', serif;
            font-size:14.5px;
            font-weight:600;
            letter-spacing:0.02em;
            cursor:pointer;
            transition:transform .12s ease, background .15s ease;
        }
        .make-btn:hover{ background:#000; }
        .make-btn:active{ transform:scale(0.98); }

        .setup-hint{
            margin-top:14px;
            font-size:11.5px;
            color:var(--muted);
            line-height:1.5;
        }

        /* ---------- COUNTDOWN VIEW ---------- */
        .board{
            width:100%;
            max-width:700px;
            text-align:center;
        }
        .board-title{
            font-size:22px;
            font-weight:600;
            color:var(--text-on-bg);
            margin:0 0 14px;
            line-height:1.4;
            word-break:keep-word;
        }

        /* 제목 아래 날짜 배지 — 이제 버튼: 누르면 팝업(링크 복사 / 다시 설정) */
        .dday-tag{
            display:inline-flex;
            align-items:center;
            gap:6px;
            font-family:'JetBrains Mono', monospace;
            font-size:13px;
            letter-spacing:0.08em;
            color:var(--brass-soft);
            background:transparent;
            border:1px solid rgba(216,180,120,0.4);
            border-radius:100px;
            padding:5px 14px;
            margin-bottom:22px;
            cursor:pointer;
            transition:background .15s ease, border-color .15s ease;
        }
        .dday-tag:hover{
            background:rgba(216,180,120,0.12);
            border-color:rgba(216,180,120,0.7);
        }
        .dday-tag::after{
            content:"⚙";
            font-size:11px;
            opacity:0.7;
        }

        .tiles-spacer{
            height:4px;
        }

        /* ---------- 팝업 (링크 복사 / 다시 설정) ---------- */
        .popup-overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.45);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:100;
            padding:20px;
        }
        .popup-card{
            width:100%;
            max-width:320px;
            background:var(--surface);
            color:var(--surface-text);
            border-radius:16px;
            padding:22px 20px 18px;
            box-shadow:var(--shadow);
            text-align:center;
        }
        .popup-title{
            font-size:13px;
            letter-spacing:0.06em;
            color:var(--muted);
            margin:0 0 16px;
            font-family:'JetBrains Mono', monospace;
            text-transform:uppercase;
        }
        .popup-btn{
            display:block;
            width:100%;
            text-align:center;
            font-family:'Noto Serif KR', serif;
            font-size:14px;
            color:var(--surface-text);
            background:var(--overlay);
            border:1px solid var(--border-line);
            border-radius:10px;
            padding:12px 0;
            margin-bottom:10px;
            cursor:pointer;
            transition:background .15s ease;
        }
        .popup-btn:hover{
            background:var(--overlay-hover);
        }
        .popup-btn.copied{
            background:var(--brass);
            color:#1c2029;
            border-color:var(--brass);
        }
        .popup-close{
            margin-top:4px;
            font-size:12px;
            color:var(--muted);
            background:none;
            border:none;
            cursor:pointer;
            text-decoration:underline;
        }

        @media (max-width:380px){
            .board-title{ font-size:18px; }
        }
    </style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="테마 전환">🌙</button>
<div id="app"></div>

<script>
    (function(){
        const app = document.getElementById('app');
        const params = new URLSearchParams(window.location.search);

        // ---------- 테마 (기본값: OS 설정 따라가기) ----------
        const mql = window.matchMedia('(prefers-color-scheme: dark)');
        let userOverrode = false;
        let currentTheme = mql.matches ? 'dark' : 'light';

        function applyTheme(){
            document.documentElement.setAttribute('data-theme', currentTheme);
            const btn = document.getElementById('themeToggle');
            if(btn) btn.textContent = currentTheme === 'dark' ? '🌙' : '☀️';
        }
        applyTheme();

        mql.addEventListener('change', (e) => {
            if(userOverrode) return; // 사용자가 직접 바꾼 뒤에는 OS 변경을 더 이상 따라가지 않음
            currentTheme = e.matches ? 'dark' : 'light';
            applyTheme();
        });

        document.getElementById('themeToggle').addEventListener('click', () => {
            userOverrode = true;
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme();
        });

        // ---------- 상태 ----------
        let tagIntervalId = null;

        function renderSetup(){
            app.innerHTML = `
      <div class="setup-card">
        <div class="setup-eyebrow">D-DAY WIDGET</div>
        <h1 class="setup-title">날짜를 입력하면<br>디데이 위젯이 만들어져요</h1>
        <div class="field">
          <label>제목 (예: 수능, 여행, 발표)</label>
          <input id="in-title" type="text" placeholder="디데이" maxlength="30">
        </div>
        <div class="row2">
          <div class="field">
            <label>날짜</label>
            <input id="in-date" type="date">
          </div>
          <div class="field">
            <label>시간</label>
            <input id="in-time" type="time" value="00:00">
          </div>
        </div>
        <button class="make-btn" id="btn-make">위젯 만들기</button>
        <div class="setup-hint">만든 후 나오는 링크를 그대로 복사해서<br>노션 embed 블록에 붙여넣으면 이 화면 대신 카운트다운이 표시돼요.</div>
      </div>
    `;
            document.getElementById('btn-make').addEventListener('click', () => {
                const title = document.getElementById('in-title').value.trim() || '디데이';
                const date = document.getElementById('in-date').value;
                const time = document.getElementById('in-time').value || '00:00';
                if(!date){
                    const dateField = document.getElementById('in-date');
                    dateField.style.borderColor = '#c0483f';
                    return;
                }
                const iso = `${date}T${time}:00`;
                const newParams = new URLSearchParams();
                newParams.set('date', iso);
                newParams.set('title', title);
                const shareUrl = buildBaseUrl() + '?' + newParams.toString();
                renderCountdown(iso, title, shareUrl);
            });
        }

        function buildBaseUrl(){
            // srcdoc / sandboxed previews don't have a usable origin+pathname,
            // fall back to a placeholder the user can replace with their published link.
            try{
                if(window.location.origin && window.location.origin !== 'null' && window.location.protocol !== 'about:'){
                    return window.location.origin + window.location.pathname;
                }
            }catch(e){}
            return '(퍼블리시된 링크)';
        }

        function openOptionsPopup(shareUrl){
            const overlay = document.createElement('div');
            overlay.className = 'popup-overlay';
            overlay.innerHTML = `
      <div class="popup-card">
        <div class="popup-title">옵션</div>
        <button class="popup-btn" id="popup-copy">🔗 링크 복사 (Notion embed용)</button>
        <button class="popup-btn" id="popup-reset">↺ 다시 설정</button>
        <button class="popup-close" id="popup-close">닫기</button>
      </div>
    `;
            document.body.appendChild(overlay);

            function closePopup(){
                overlay.remove();
            }

            overlay.addEventListener('click', (e) => {
                if(e.target === overlay) closePopup();
            });
            document.getElementById('popup-close').addEventListener('click', closePopup);

            document.getElementById('popup-reset').addEventListener('click', () => {
                closePopup();
                renderSetup();
            });

            document.getElementById('popup-copy').addEventListener('click', (e) => {
                const btn = e.currentTarget;
                const doCopyFallback = () => {
                    const ta = document.createElement('textarea');
                    ta.value = shareUrl;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try{ document.execCommand('copy'); }catch(err){}
                    document.body.removeChild(ta);
                };
                if(navigator.clipboard && navigator.clipboard.writeText){
                    navigator.clipboard.writeText(shareUrl).catch(doCopyFallback);
                } else {
                    doCopyFallback();
                }
                btn.textContent = '✓ 복사됨';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '🔗 링크 복사 (Notion embed용)';
                    btn.classList.remove('copied');
                }, 1400);
            });
        }

        function renderCountdown(isoDate, title, shareUrlOverride){
            const target = new Date(isoDate);
            const shareUrl = shareUrlOverride || window.location.href;

            app.innerHTML = `
      <div class="board">
        <h1 class="board-title">${escapeHtml(title)}</h1>
        <button class="dday-tag" id="ddayTag">D-0</button>
        <div class="flipdown-wrap">
          <div class="flipdown flipdown__theme-dark" id="flipdownEl"></div>
        </div>
        <div class="tiles-spacer"></div>
      </div>
    `;

            document.getElementById('ddayTag').addEventListener('click', () => {
                openOptionsPopup(shareUrl);
            });

            // D-day 배지 텍스트 — 이전 타이머를 반드시 지우고 나서 새로 시작 (누적/깜빡임 방지)
            if(tagIntervalId !== null){
                clearInterval(tagIntervalId);
                tagIntervalId = null;
            }
            function updateTag(){
                const now = new Date();
                const diff = target.getTime() - now.getTime();
                const isFuture = diff >= 0;
                const days = Math.floor(Math.abs(diff) / 86400000);
                const tag = document.getElementById('ddayTag');
                if(!tag) return;
                if(days === 0 && isFuture){
                    tag.textContent = 'D-DAY';
                } else if(isFuture){
                    tag.textContent = 'D-' + days;
                } else {
                    tag.textContent = 'D+' + days;
                }
            }
            updateTag();
            tagIntervalId = setInterval(updateTag, 1000);

            // FlipDown countdown — table-tennis scoreboard style flip animation
            const nowSec = Math.floor(Date.now() / 1000);
            const targetSec = Math.floor(target.getTime() / 1000);
            const flipTargetSec = targetSec > nowSec ? targetSec : nowSec; // FlipDown can't count up past a passed date
            try{
                new FlipDown(flipTargetSec, 'flipdownEl', {
                    theme: 'dark',
                    headings: ['일', '시간', '분', '초']
                }).start();
            }catch(err){
                // FlipDown failed to load (e.g. CDN blocked) — fall back to a plain text readout
                document.getElementById('flipdownEl').innerHTML =
                    '<div style="font-family:\'JetBrains Mono\',monospace;color:var(--muted);font-size:13px;">카운트다운 애니메이션을 불러오지 못했어요 (네트워크 차단 시 발생)</div>';
            }
        }

        function escapeHtml(str){
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // entry point
        const dateParam = params.get('date');
        const titleParam = params.get('title') || '디데이';
        if(dateParam){
            renderCountdown(dateParam, titleParam, window.location.href);
        } else {
            renderSetup();
        }
    })();
</script>

</body>
</html>
